# Explicit project name — do not remove.
#
# Both this repo and project-youness keep their compose file in a folder
# literally named "backend". Docker Compose derives its project name (and,
# critically, its build image tags: "<project>-<service>") from that folder
# name by default when none is given — so without this line, deploying this
# stack on a host that already runs project-youness silently collides on
# EVERY identifier Compose uses for ownership: same project "backend", same
# service names (mongo/app/poller/proxy), same image tags. `docker compose up`
# then treats this stack as an update to the OTHER app and replaces its
# containers and images with this one's. That is exactly what took
# project-youness down on 2026-09-13's first deploy attempt.
name: orange-traffic

services:
  mongo:
    image: mongo:7
    container_name: orange-traffic-mongo
    restart: always
    # Loopback-only — needed so the poller (network_mode: host, below) can
    # still reach Mongo by IP once it no longer shares Docker's bridge
    # network. Binding to 127.0.0.1 keeps this off the VPS's real network
    # interfaces; do not change this to a bare port or "0.0.0.0:...".
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: orange-traffic-app
    restart: always
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/orangetraffic
      TZ: America/Toronto
      # The poller runs with network_mode: host (below), so it no longer has
      # a "poller" DNS name on this app's bridge network — reach it via
      # Docker Desktop's host alias instead.
      HOST_PY: host.docker.internal
      PORT_PY: 8000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  poller:
    container_name: orange-traffic-poller
    restart: always
    build:
      context: ..
      dockerfile: backend/python/Dockerfile
    env_file: .env
    # Shares the WSL2 VM's own network stack directly instead of Docker's
    # private bridge — with WSL2 mirrored networking already enabled
    # (.wslconfig), this puts outbound SNMP traffic straight onto the host's
    # real interfaces with no extra Docker-level NAT hop in between. Requires
    # "Enable host networking" turned on once in Docker Desktop's Settings →
    # Resources → Network. See DEPLOYMENT.md for the full rationale and the
    # tradeoffs this brings (loses the "poller" DNS name, exposes :8000 on
    # the host — mitigated by the X-Poller-Token check in app.py).
    network_mode: host
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://127.0.0.1:27017/orangetraffic
      TZ: America/Toronto
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    container_name: orange-traffic-proxy
    restart: always
    build:
      context: ..
      dockerfile: backend/nginx/Dockerfile
    # 80/443 are already taken on this host by another app (project-youness),
    # and 8080 turned out to already be in use by something else again on the
    # target VPS — 18080/18443 is an uncommon enough pair to avoid a third
    # collision. The container's own nginx config still listens on 80/443
    # internally; only the host-side mapping differs. If either of these is
    # ALSO taken, check what's actually free first (see DEPLOYMENT.md §1)
    # rather than guessing a fourth pair — and update
    # backend/nginx/default.conf's hardcoded redirect port to match.
    ports:
      - "18080:80"
      - "18443:443"
    depends_on:
      - app

volumes:
  mongo-data:
